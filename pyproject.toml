[project]
name = "information-retrieval"
version = "0.1.0"
description = "Repo to test Information Retrieval algorithms, following USP classes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "ir-datasets>=0.6.3",
    "kaggle>=2.2.5",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "ir-measures>=0.4.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# O pacote `ir/` é instalado em modo editável pelo `uv sync`, para que os
# scripts em `scripts/` e os testes em `tests/` possam importá-lo.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
